<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flight Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
            color: #1f2937;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }
        .field {
            display: flex;
            flex-direction: column;
            min-width: 180px;
        }
        input, button {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d0d7de;
            font-size: 14px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 10px;
            text-align: left;
        }
        th {
            background: #eff6ff;
        }
        .empty {
            color: #6b7280;
            padding: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Flight Search</h1>

    <form th:action="@{/}" method="get">
        <div class="field">
            <label for="origin">From</label>
            <input type="text" id="origin" name="origin" th:value="${origin}" placeholder="Delhi">
        </div>

        <div class="field">
            <label for="destination">To</label>
            <input type="text" id="destination" name="destination" th:value="${destination}" placeholder="Mumbai">
        </div>

        <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" th:value="${date}">
        </div>

        <div class="field" style="justify-content:flex-end;">
            <button type="submit">Search Flights</button>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(flights)}" class="empty">
        No flights match your search criteria.
    </div>

    <table th:if="${not #lists.isEmpty(flights)}">
        <thead>
        <tr>
            <th>Flight</th>
            <th>Airline</th>
            <th>Route</th>
            <th>Date</th>
            <th>Departure</th>
            <th>Arrival</th>
            <th>Price</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="flight : ${flights}">
            <td th:text="${flight.flightNumber}">AI-201</td>
            <td th:text="${flight.airline}">Air India</td>
            <td th:text="${flight.origin + ' → ' + flight.destination}">Delhi → Mumbai</td>
            <td th:text="${flight.departureDate}">2026-10-13</td>
            <td th:text="${flight.departureTime}">08:30</td>
            <td th:text="${flight.arrivalTime}">10:45</td>
            <td th:text="'₹' + ${flight.price}">₹5200.00</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
